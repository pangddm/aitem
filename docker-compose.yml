services:

  redis:
    image: redis:7
    container_name: kubedoctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  postgres:
    image: pgvector/pgvector:pg17
    container_name: kubedoctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  neo4j:
    image: neo4j:latest
    container_name: kubedoctor-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data

  mysql:
      image: mysql:8.0
      container_name: kubedoctor-mysql
      restart: unless-stopped
      environment:
        # 如果需要创建一个默认用户，也可以加上 MYSQL_USER 和 MYSQL_PASSWORD
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      ports:
        - "3306:3306"
      volumes:
        - ./data/mysql:/var/lib/mysql